environment: homolog

replicaCount: 2

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: oficina-api

# AWS Academy: sem AWS Load Balancer Controller / TargetGroupBinding.
# type LoadBalancer -> o cloud-provider in-tree do EKS cria um ELB publico.
service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

# O Secret "oficina-api" (DATABASE_URL, JWT_SECRET, ...) e criado pelo pipeline
# a partir do AWS Secrets Manager (sem External Secrets Operator).

config:
  phase4Enabled: "true"
  billingServiceUrl: "http://oficina-billing:3001"
  productionServiceUrl: "http://oficina-production-service:3002"
  inboxQueueUrl: ""
  billingQueueUrl: ""
  productionQueueUrl: ""
  awsRegion: us-east-1
  notificationQueueUrl: ""
  corsOrigin: "*"
  cspConnectSrc: ""
  jwtIssuer: oficina-auth-serverless
  jwtAudience: oficina-api
  ddSite: datadoghq.com
  ddService: oficina-api
  ddVersion: latest
  ddEnabled: "false"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1
