{{- if .Values.targetGroupArn }}
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: oficina-api
  labels:
    {{- include "oficina-api.labels" . | nindent 4 }}
spec:
  serviceRef:
    name: oficina-api
    port: {{ .Values.service.port }}
  targetGroupARN: {{ .Values.targetGroupArn | quote }}
  targetType: ip
{{- end }}

