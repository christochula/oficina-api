name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch revisada que contem o commit aprovado no CI
        required: true
        type: string
      target_sha:
        description: SHA completo de 40 caracteres, deve ser o HEAD da branch
        required: true
        type: string
  push:
    tags: ["phase4/os-deploy-*"]
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-phase4-os
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  NAMESPACE: oficina-fase4
  ECR_REPOSITORY: oficina-fase4-os
  CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'oficina-homolog-eks' }}
jobs:
  deploy:
    name: Deploy OS
    environment: homolog
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}
      TARGET_REF: ${{ inputs.target_ref || github.event.workflow_run.head_branch || vars.DEPLOY_SOURCE_REF || 'feature/phase4-distributed' }}
    steps:
      - name: Checkout reviewed workflow controls before target source
        uses: actions/checkout@v4
        with: { ref: "${{ github.workflow_sha }}" }
      - name: Verify exact commit passed every required gate before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUIRED_DEPLOY_GATES: Quality,Integration,Sonar,Frontend,BDD,Container
          CI_WORKFLOW_FILE: ci.yml
          DISPATCH_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          DISPATCH_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref || '' }}
        run: node scripts/check-deploy-gates.mjs
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with: { ref: "${{ env.TARGET_SHA }}" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve kubectl version matching the EKS cluster minor
        id: kubectl
        run: |
          set -euo pipefail
          minor="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.version --output text)"
          [[ "$minor" =~ ^1\.[0-9]+$ ]] || { echo 'Unexpected EKS version'; exit 1; }
          version="$(curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "https://dl.k8s.io/release/stable-${minor}.txt")"
          [[ "$version" =~ ^v1\.[0-9]+\.[0-9]+$ ]] || { echo 'Unexpected official kubectl version'; exit 1; }
          case "$version" in "v$minor".*) ;; *) echo 'kubectl minor must match EKS'; exit 1 ;; esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ steps.kubectl.outputs.version }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.FRONTEND_API_BASE_URL || '/api/v1' }}
            VITE_CLIENT_AUTH_BASE_URL=${{ vars.FRONTEND_CLIENT_AUTH_BASE_URL || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v4
        with: { version: v3.17.3 }
      - name: Configure Kubernetes and isolated runtime secret
        env:
          DATABASE_SECRET_ID: ${{ vars.OS_DATABASE_SECRET_ID }}
          JWT_SECRET_ID: ${{ vars.JWT_SECRET_ID }}
          RUNTIME_SECRET_ID: ${{ vars.OS_RUNTIME_SECRET_ID }}
        run: bash scripts/prepare-os-deploy-secrets.sh
      - name: Deploy Fase 4 without replacing legacy namespace
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          TAG: ${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          INBOX_QUEUE_URL: ${{ vars.OS_QUEUE_URL }}
          BILLING_QUEUE_URL: ${{ vars.BILLING_QUEUE_URL }}
          PRODUCTION_QUEUE_URL: ${{ vars.PRODUCTION_QUEUE_URL }}
          BILLING_SERVICE_URL: ${{ vars.BILLING_SERVICE_URL || 'http://oficina-billing:3001' }}
          PRODUCTION_SERVICE_URL: ${{ vars.PRODUCTION_SERVICE_URL || 'http://oficina-production-service:3002' }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          DD_ENABLED: ${{ vars.DD_ENABLED || 'true' }}
          DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
          CLIENT_AUTH_URL: ${{ vars.FRONTEND_CLIENT_AUTH_BASE_URL }}
          NOTIFICATION_QUEUE_URL: ${{ vars.NOTIFICATION_QUEUE_URL }}
        run: |
          set -euo pipefail
          helm upgrade --install oficina-api helm/oficina-api --namespace "$NAMESPACE" --create-namespace --atomic --wait --timeout 12m \
            --set-string image.repository="$IMAGE" --set-string image.tag="$TAG" \
            --set-string config.phase4Enabled=true --set-string config.ddVersion="$TAG" \
            --set-string config.inboxQueueUrl="$INBOX_QUEUE_URL" --set-string config.billingQueueUrl="$BILLING_QUEUE_URL" \
            --set-string config.productionQueueUrl="$PRODUCTION_QUEUE_URL" --set-string config.billingServiceUrl="$BILLING_SERVICE_URL" \
            --set-string config.productionServiceUrl="$PRODUCTION_SERVICE_URL" --set-string config.ddEnabled="$DD_ENABLED" \
            --set-string config.ddSite="$DD_SITE" --set-string config.corsOrigin="$CORS_ORIGIN" \
            --set-string config.cspConnectSrc="$CLIENT_AUTH_URL" --set-string config.notificationQueueUrl="$NOTIFICATION_QUEUE_URL"
          kubectl rollout status deployment/oficina-api -n "$NAMESPACE" --timeout=5m
          kubectl get pods,svc,hpa -n "$NAMESPACE"
      - name: Ensure the initial administrator exists after migrations and rollout
        run: |
          set -euo pipefail
          kubectl exec -n "$NAMESPACE" deployment/oficina-api -c api -- node dist/prisma/seed.js
