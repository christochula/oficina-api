name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-phase4-os
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  NAMESPACE: oficina-fase4
  ECR_REPOSITORY: oficina-fase4-os
  CLUSTER_NAME: oficina-homolog-eks
jobs:
  deploy:
    name: Deploy OS
    environment: homolog
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - name: Verify exact commit passed every required gate before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/check-deploy-gates.mjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.FRONTEND_API_BASE_URL || '/api/v1' }}
            VITE_CLIENT_AUTH_BASE_URL=${{ vars.FRONTEND_CLIENT_AUTH_BASE_URL || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v4
        with: { version: v3.17.3 }
      - name: Configure Kubernetes and isolated runtime secret
        env:
          DATABASE_SECRET_ID: ${{ vars.OS_DATABASE_SECRET_ID }}
          JWT_SECRET_ID: ${{ vars.JWT_SECRET_ID }}
          RUNTIME_SECRET_ID: ${{ vars.OS_RUNTIME_SECRET_ID }}
        run: bash scripts/prepare-os-deploy-secrets.sh
      - name: Deploy Fase 4 without replacing legacy namespace
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          TAG: ${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          INBOX_QUEUE_URL: ${{ vars.OS_QUEUE_URL }}
          BILLING_QUEUE_URL: ${{ vars.BILLING_QUEUE_URL }}
          PRODUCTION_QUEUE_URL: ${{ vars.PRODUCTION_QUEUE_URL }}
          BILLING_SERVICE_URL: ${{ vars.BILLING_SERVICE_URL || 'http://oficina-billing:3001' }}
          PRODUCTION_SERVICE_URL: ${{ vars.PRODUCTION_SERVICE_URL || 'http://oficina-production-service:3002' }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          DD_ENABLED: ${{ vars.DD_ENABLED || 'true' }}
          DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
          CLIENT_AUTH_URL: ${{ vars.FRONTEND_CLIENT_AUTH_BASE_URL }}
          NOTIFICATION_QUEUE_URL: ${{ vars.NOTIFICATION_QUEUE_URL }}
        run: |
          set -euo pipefail
          helm upgrade --install oficina-api helm/oficina-api --namespace "$NAMESPACE" --create-namespace --atomic --wait --timeout 12m \
            --set-string image.repository="$IMAGE" --set-string image.tag="$TAG" \
            --set-string config.phase4Enabled=true --set-string config.ddVersion="$TAG" \
            --set-string config.inboxQueueUrl="$INBOX_QUEUE_URL" --set-string config.billingQueueUrl="$BILLING_QUEUE_URL" \
            --set-string config.productionQueueUrl="$PRODUCTION_QUEUE_URL" --set-string config.billingServiceUrl="$BILLING_SERVICE_URL" \
            --set-string config.productionServiceUrl="$PRODUCTION_SERVICE_URL" --set-string config.ddEnabled="$DD_ENABLED" \
            --set-string config.ddSite="$DD_SITE" --set-string config.corsOrigin="$CORS_ORIGIN" \
            --set-string config.cspConnectSrc="$CLIENT_AUTH_URL" --set-string config.notificationQueueUrl="$NOTIFICATION_QUEUE_URL"
          kubectl rollout status deployment/oficina-api -n "$NAMESPACE" --timeout=5m
          kubectl get pods,svc,hpa -n "$NAMESPACE"
