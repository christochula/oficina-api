name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: 634752293949.dkr.ecr.us-east-1.amazonaws.com/oficina-api
  ECR_REPOSITORY_NAME: oficina-api

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

  build-push-image:
    runs-on: ubuntu-latest
    needs: build-test

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required AWS secrets
        run: |
          test -n "${{ secrets.AWS_REGION }}" || { echo "::error::Missing secret AWS_REGION"; exit 1; }
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || { echo "::error::Missing secret AWS_ACCESS_KEY_ID when AWS_ROLE_ARN is empty"; exit 1; }
            test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || { echo "::error::Missing secret AWS_SECRET_ACCESS_KEY when AWS_ROLE_ARN is empty"; exit 1; }
            test -n "${{ secrets.AWS_SESSION_TOKEN }}" || { echo "::error::Missing secret AWS_SESSION_TOKEN when AWS_ROLE_ARN is empty"; exit 1; }
          fi

      - name: Define image tag
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Decide AWS auth mode
        id: aws_auth_mode
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "use_oidc=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_oidc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.aws_auth_mode.outputs.use_oidc == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (Access Key fallback)
        if: ${{ steps.aws_auth_mode.outputs.use_oidc == 'false' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY_NAME" --region "${{ secrets.AWS_REGION }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY_NAME" --region "${{ secrets.AWS_REGION }}" >/dev/null

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.meta.outputs.image_tag }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ steps.meta.outputs.image_tag }}
          docker push $IMAGE_NAME:latest

  terraform-apply:
    runs-on: ubuntu-latest
    needs: build-push-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Terraform secrets
        run: |
          test -n "${{ secrets.AWS_REGION }}" || { echo "::error::Missing secret AWS_REGION"; exit 1; }
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || { echo "::error::Missing secret AWS_ACCESS_KEY_ID when AWS_ROLE_ARN is empty"; exit 1; }
            test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || { echo "::error::Missing secret AWS_SECRET_ACCESS_KEY when AWS_ROLE_ARN is empty"; exit 1; }
            test -n "${{ secrets.AWS_SESSION_TOKEN }}" || { echo "::error::Missing secret AWS_SESSION_TOKEN when AWS_ROLE_ARN is empty"; exit 1; }
          fi
          test -n "${{ secrets.DB_PASSWORD_SECRET_NAME }}" || { echo "::error::Missing secret DB_PASSWORD_SECRET_NAME"; exit 1; }
          test -n "${{ secrets.APP_K8S_SECRET_NAME }}" || { echo "::error::Missing secret APP_K8S_SECRET_NAME"; exit 1; }
          test -n "${{ secrets.POSTGRES_K8S_SECRET_NAME }}" || { echo "::error::Missing secret POSTGRES_K8S_SECRET_NAME"; exit 1; }
          test -n "${{ secrets.CLUSTER_IAM_ROLE_NAME }}" || { echo "::error::Missing secret CLUSTER_IAM_ROLE_NAME"; exit 1; }
          test -n "${{ secrets.NODE_IAM_ROLE_NAME }}" || { echo "::error::Missing secret NODE_IAM_ROLE_NAME"; exit 1; }
          test -n "${{ secrets.CLUSTER_ADMIN_ROLE_NAME }}" || { echo "::error::Missing secret CLUSTER_ADMIN_ROLE_NAME"; exit 1; }

      - name: Decide AWS auth mode
        id: aws_auth_mode
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "use_oidc=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_oidc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.aws_auth_mode.outputs.use_oidc == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (Access Key fallback)
        if: ${{ steps.aws_auth_mode.outputs.use_oidc == 'false' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Patch EKS module for AWS Academy
        working-directory: infra
        run: ./scripts/patch-eks-talent-lab.sh

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ""
          TF_VAR_db_password_secret_name: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          TF_VAR_use_secrets_manager_for_k8s_secrets: true
          TF_VAR_app_k8s_secret_name: ${{ secrets.APP_K8S_SECRET_NAME }}
          TF_VAR_postgres_k8s_secret_name: ${{ secrets.POSTGRES_K8S_SECRET_NAME }}
          TF_VAR_cluster_iam_role_name: ${{ secrets.CLUSTER_IAM_ROLE_NAME }}
          TF_VAR_node_iam_role_name: ${{ secrets.NODE_IAM_ROLE_NAME }}
          TF_VAR_cluster_admin_role_name: ${{ secrets.CLUSTER_ADMIN_ROLE_NAME }}
          TF_VAR_environment: prod
          TF_VAR_apply_k8s_manifests: false
        run: terraform plan -out=tfplan-infra

      - name: Terraform apply infra
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ""
          TF_VAR_db_password_secret_name: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          TF_VAR_use_secrets_manager_for_k8s_secrets: true
          TF_VAR_app_k8s_secret_name: ${{ secrets.APP_K8S_SECRET_NAME }}
          TF_VAR_postgres_k8s_secret_name: ${{ secrets.POSTGRES_K8S_SECRET_NAME }}
          TF_VAR_cluster_iam_role_name: ${{ secrets.CLUSTER_IAM_ROLE_NAME }}
          TF_VAR_node_iam_role_name: ${{ secrets.NODE_IAM_ROLE_NAME }}
          TF_VAR_cluster_admin_role_name: ${{ secrets.CLUSTER_ADMIN_ROLE_NAME }}
          TF_VAR_environment: prod
          TF_VAR_apply_k8s_manifests: false
        run: terraform apply -auto-approve tfplan-infra

      - name: Terraform plan manifests
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ""
          TF_VAR_db_password_secret_name: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          TF_VAR_use_secrets_manager_for_k8s_secrets: true
          TF_VAR_app_k8s_secret_name: ${{ secrets.APP_K8S_SECRET_NAME }}
          TF_VAR_postgres_k8s_secret_name: ${{ secrets.POSTGRES_K8S_SECRET_NAME }}
          TF_VAR_cluster_iam_role_name: ${{ secrets.CLUSTER_IAM_ROLE_NAME }}
          TF_VAR_node_iam_role_name: ${{ secrets.NODE_IAM_ROLE_NAME }}
          TF_VAR_cluster_admin_role_name: ${{ secrets.CLUSTER_ADMIN_ROLE_NAME }}
          TF_VAR_environment: prod
          TF_VAR_apply_k8s_manifests: true
        run: terraform plan -out=tfplan-manifests

      - name: Terraform apply manifests
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ""
          TF_VAR_db_password_secret_name: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          TF_VAR_use_secrets_manager_for_k8s_secrets: true
          TF_VAR_app_k8s_secret_name: ${{ secrets.APP_K8S_SECRET_NAME }}
          TF_VAR_postgres_k8s_secret_name: ${{ secrets.POSTGRES_K8S_SECRET_NAME }}
          TF_VAR_cluster_iam_role_name: ${{ secrets.CLUSTER_IAM_ROLE_NAME }}
          TF_VAR_node_iam_role_name: ${{ secrets.NODE_IAM_ROLE_NAME }}
          TF_VAR_cluster_admin_role_name: ${{ secrets.CLUSTER_ADMIN_ROLE_NAME }}
          TF_VAR_environment: prod
          TF_VAR_apply_k8s_manifests: true
        run: terraform apply -auto-approve tfplan-manifests
