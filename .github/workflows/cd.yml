name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: oficina-api-prod-deploy
  cancel-in-progress: false

env:
  ECR_REPOSITORY_NAME: oficina-api

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

  build-push-image:
    runs-on: ubuntu-latest
    needs: build-test

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.ecr_meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required AWS secrets
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          require_secret() {
            local name="$1"
            local value="${2:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "::error::Missing or blank secret $name"
              exit 1
            fi
          }

          require_secret AWS_REGION "$AWS_REGION"
          if [ -z "${AWS_ROLE_ARN//[[:space:]]/}" ]; then
            require_secret AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID"
            require_secret AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY"
            require_secret AWS_SESSION_TOKEN "$AWS_SESSION_TOKEN"
          fi

      - name: Define image tag
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Decide AWS auth mode
        id: aws_auth_mode
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "use_oidc=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_oidc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.aws_auth_mode.outputs.use_oidc == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (Access Key fallback)
        if: ${{ steps.aws_auth_mode.outputs.use_oidc == 'false' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY_NAME" --region "${{ secrets.AWS_REGION }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY_NAME" --region "${{ secrets.AWS_REGION }}" >/dev/null

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR image name
        id: ecr_meta
        run: |
          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "image_name=${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${ECR_REPOSITORY_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          IMAGE_NAME="${{ steps.ecr_meta.outputs.image_name }}"
          docker build -t "$IMAGE_NAME:${{ steps.meta.outputs.image_tag }}" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:${{ steps.meta.outputs.image_tag }}"
          docker push "$IMAGE_NAME:latest"

  terraform-apply:
    runs-on: ubuntu-latest
    needs: build-push-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Terraform secrets
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DB_PASSWORD_SECRET_NAME: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          APP_K8S_SECRET_NAME: ${{ secrets.APP_K8S_SECRET_NAME }}
          CLUSTER_IAM_ROLE_NAME: ${{ secrets.CLUSTER_IAM_ROLE_NAME }}
          NODE_IAM_ROLE_NAME: ${{ secrets.NODE_IAM_ROLE_NAME }}
          CLUSTER_ADMIN_ROLE_NAME: ${{ secrets.CLUSTER_ADMIN_ROLE_NAME }}
        run: |
          require_secret() {
            local name="$1"
            local value="${2:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "::error::Missing or blank secret $name"
              exit 1
            fi
          }

          require_secret AWS_REGION "$AWS_REGION"
          if [ -z "${AWS_ROLE_ARN//[[:space:]]/}" ]; then
            require_secret AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID"
            require_secret AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY"
            require_secret AWS_SESSION_TOKEN "$AWS_SESSION_TOKEN"
          fi
          require_secret DB_PASSWORD_SECRET_NAME "$DB_PASSWORD_SECRET_NAME"
          require_secret APP_K8S_SECRET_NAME "$APP_K8S_SECRET_NAME"
          require_secret CLUSTER_IAM_ROLE_NAME "$CLUSTER_IAM_ROLE_NAME"
          require_secret NODE_IAM_ROLE_NAME "$NODE_IAM_ROLE_NAME"
          require_secret CLUSTER_ADMIN_ROLE_NAME "$CLUSTER_ADMIN_ROLE_NAME"

      - name: Decide AWS auth mode
        id: aws_auth_mode
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "use_oidc=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_oidc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.aws_auth_mode.outputs.use_oidc == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (Access Key fallback)
        if: ${{ steps.aws_auth_mode.outputs.use_oidc == 'false' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Ensure Terraform state bucket
        id: tf_backend
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="oficina-api-tfstate-${AWS_ACCOUNT_ID}-${AWS_REGION}"

          if ! aws s3api head-bucket --bucket "$BUCKET" >/dev/null 2>&1; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" >/dev/null
            else
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION" >/dev/null
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled >/dev/null || \
            echo "::warning::Nao foi possivel habilitar versionamento no bucket de state"

          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' >/dev/null || \
            echo "::warning::Nao foi possivel configurar criptografia explicita no bucket de state"

          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true >/dev/null || \
            echo "::warning::Nao foi possivel configurar bloqueio de acesso publico no bucket de state"

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.tf_backend.outputs.bucket }}" \
            -backend-config="key=oficina-api/prod/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Patch EKS module for AWS Academy
        working-directory: infra
        run: ./scripts/patch-eks-talent-lab.sh

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform adopt pre-existing prod globals
        working-directory: infra
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          DB_SUBNET_GROUP_NAME="oficina-api-prod-db-subnets"
          KMS_ALIAS_NAME="alias/eks/oficina-api-prod"
          EKS_LOG_GROUP_NAME="/aws/eks/oficina-api-prod/cluster"

          if aws rds describe-db-subnet-groups \
            --db-subnet-group-name "$DB_SUBNET_GROUP_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            terraform state show aws_db_subnet_group.this >/dev/null 2>&1 || \
              terraform import aws_db_subnet_group.this "$DB_SUBNET_GROUP_NAME"
          fi

          if aws kms describe-key \
            --key-id "$KMS_ALIAS_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            terraform state show 'module.eks.module.kms.aws_kms_alias.this["cluster"]' >/dev/null 2>&1 || \
              terraform import 'module.eks.module.kms.aws_kms_alias.this["cluster"]' "$KMS_ALIAS_NAME"
          fi

          if aws logs describe-log-groups \
            --log-group-name-prefix "$EKS_LOG_GROUP_NAME" \
            --region "$AWS_REGION" \
            --query "logGroups[?logGroupName=='$EKS_LOG_GROUP_NAME'].logGroupName" \
            --output text | grep -q "$EKS_LOG_GROUP_NAME"; then
            terraform state show 'module.eks.aws_cloudwatch_log_group.this[0]' >/dev/null 2>&1 || \
              terraform import 'module.eks.aws_cloudwatch_log_group.this[0]' "$EKS_LOG_GROUP_NAME"
          fi

      - name: Detect existing AWS base stack
        id: aws_base_stack
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          EKS_EXISTS=false
          RDS_EXISTS=false

          if aws eks describe-cluster \
            --name oficina-api-prod \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            EKS_EXISTS=true
          fi

          if aws rds describe-db-instances \
            --db-instance-identifier oficina-api-prod-postgres \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            RDS_EXISTS=true
          fi

          echo "eks_exists=$EKS_EXISTS" >> "$GITHUB_OUTPUT"
          echo "rds_exists=$RDS_EXISTS" >> "$GITHUB_OUTPUT"

          if [ "$EKS_EXISTS" = "true" ] && [ "$RDS_EXISTS" = "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove stale Kubernetes state when EKS is absent
        if: steps.aws_base_stack.outputs.eks_exists == 'false'
        working-directory: infra
        run: |
          set -euo pipefail

          mapfile -t K8S_STATE_ADDRESSES < <(terraform state list | grep -E '^(kubernetes_manifest\.|kubernetes_secret_v1\.)' || true)

          if [ "${#K8S_STATE_ADDRESSES[@]}" -eq 0 ]; then
            echo "No Kubernetes resources found in Terraform state."
            exit 0
          fi

          printf 'Removing stale Kubernetes state address: %s\n' "${K8S_STATE_ADDRESSES[@]}"
          terraform state rm "${K8S_STATE_ADDRESSES[@]}"

      - name: Terraform plan
        if: steps.aws_base_stack.outputs.exists == 'false'
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ""
          TF_VAR_db_password_secret_name: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          TF_VAR_use_secrets_manager_for_k8s_secrets: true
          TF_VAR_app_k8s_secret_name: ${{ secrets.APP_K8S_SECRET_NAME }}
          TF_VAR_postgres_k8s_secret_name: ${{ secrets.POSTGRES_K8S_SECRET_NAME }}
          TF_VAR_deploy_k8s_postgres: "false"
          TF_VAR_app_image: ${{ needs.build-push-image.outputs.image_uri }}
          TF_VAR_require_existing_iam_roles: "true"
          TF_VAR_cluster_iam_role_name: ${{ secrets.CLUSTER_IAM_ROLE_NAME }}
          TF_VAR_node_iam_role_name: ${{ secrets.NODE_IAM_ROLE_NAME }}
          TF_VAR_cluster_admin_role_name: ${{ secrets.CLUSTER_ADMIN_ROLE_NAME }}
          TF_VAR_environment: prod
          TF_VAR_apply_k8s_manifests: false
        run: terraform plan -out=tfplan-infra

      - name: Terraform apply infra
        if: steps.aws_base_stack.outputs.exists == 'false'
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ""
          TF_VAR_db_password_secret_name: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          TF_VAR_use_secrets_manager_for_k8s_secrets: true
          TF_VAR_app_k8s_secret_name: ${{ secrets.APP_K8S_SECRET_NAME }}
          TF_VAR_postgres_k8s_secret_name: ${{ secrets.POSTGRES_K8S_SECRET_NAME }}
          TF_VAR_deploy_k8s_postgres: "false"
          TF_VAR_app_image: ${{ needs.build-push-image.outputs.image_uri }}
          TF_VAR_require_existing_iam_roles: "true"
          TF_VAR_cluster_iam_role_name: ${{ secrets.CLUSTER_IAM_ROLE_NAME }}
          TF_VAR_node_iam_role_name: ${{ secrets.NODE_IAM_ROLE_NAME }}
          TF_VAR_cluster_admin_role_name: ${{ secrets.CLUSTER_ADMIN_ROLE_NAME }}
          TF_VAR_environment: prod
          TF_VAR_apply_k8s_manifests: false
        run: terraform apply -auto-approve tfplan-infra

      - name: Sync DATABASE_URL in app secret from fresh RDS endpoint
        working-directory: infra
        env:
          APP_K8S_SECRET_NAME: ${{ secrets.APP_K8S_SECRET_NAME }}
          DB_PASSWORD_SECRET_NAME: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
        run: |
          set -euo pipefail

          RDS_ENDPOINT="$(terraform output -raw rds_endpoint)"
          RDS_PORT="$(terraform output -raw rds_port)"

          APP_SECRET_RAW="$(aws secretsmanager get-secret-value \
            --secret-id "$APP_K8S_SECRET_NAME" \
            --query SecretString \
            --output text)"

          DB_PASSWORD_RAW="$(aws secretsmanager get-secret-value \
            --secret-id "$DB_PASSWORD_SECRET_NAME" \
            --query SecretString \
            --output text)"

          if echo "$DB_PASSWORD_RAW" | jq -e . >/dev/null 2>&1; then
            DB_PASSWORD="$(echo "$DB_PASSWORD_RAW" | jq -r '.db_password // empty')"
          else
            DB_PASSWORD="$DB_PASSWORD_RAW"
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Nao foi possivel obter db_password no secret $DB_PASSWORD_SECRET_NAME"
            exit 1
          fi

          DB_PASSWORD_URI="$(jq -nr --arg v "$DB_PASSWORD" '$v|@uri')"
          DATABASE_URL="postgresql://oficina:${DB_PASSWORD_URI}@${RDS_ENDPOINT}:${RDS_PORT}/oficina_db"

          APP_SECRET_UPDATED="$(echo "$APP_SECRET_RAW" | jq --arg database_url "$DATABASE_URL" '.DATABASE_URL = $database_url')"

          aws secretsmanager put-secret-value \
            --secret-id "$APP_K8S_SECRET_NAME" \
            --secret-string "$APP_SECRET_UPDATED" >/dev/null

          echo "DATABASE_URL sincronizada no Secrets Manager com endpoint RDS atual"

      - name: Configure kubectl for EKS
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: aws eks update-kubeconfig --name oficina-api-prod --region "$AWS_REGION"

      - name: Wait for EKS worker nodes
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            NODE_COUNT="$(kubectl get nodes --no-headers 2>/dev/null | wc -l | tr -d ' ')"
            if [ "$NODE_COUNT" -gt 0 ]; then
              kubectl wait --for=condition=Ready nodes --all --timeout=20m
              kubectl get nodes -o wide
              exit 0
            fi

            echo "Waiting for EKS worker nodes to register... attempt $attempt/60"
            sleep 10
          done

          echo "::error::No EKS worker nodes registered within 10 minutes."
          kubectl get nodes -o wide || true
          exit 1

      - name: Remove previous migration Job
        run: |
          set -euo pipefail

          if kubectl get namespace oficina-api >/dev/null 2>&1; then
            kubectl -n oficina-api delete job oficina-api-migrate --ignore-not-found=true
          fi

      - name: Terraform plan manifests
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ""
          TF_VAR_db_password_secret_name: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          TF_VAR_use_secrets_manager_for_k8s_secrets: true
          TF_VAR_app_k8s_secret_name: ${{ secrets.APP_K8S_SECRET_NAME }}
          TF_VAR_postgres_k8s_secret_name: ${{ secrets.POSTGRES_K8S_SECRET_NAME }}
          TF_VAR_deploy_k8s_postgres: "false"
          TF_VAR_app_image: ${{ needs.build-push-image.outputs.image_uri }}
          TF_VAR_require_existing_iam_roles: "true"
          TF_VAR_cluster_iam_role_name: ${{ secrets.CLUSTER_IAM_ROLE_NAME }}
          TF_VAR_node_iam_role_name: ${{ secrets.NODE_IAM_ROLE_NAME }}
          TF_VAR_cluster_admin_role_name: ${{ secrets.CLUSTER_ADMIN_ROLE_NAME }}
          TF_VAR_environment: prod
          TF_VAR_apply_k8s_manifests: true
        run: terraform plan -out=tfplan-manifests

      - name: Terraform apply manifests
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ""
          TF_VAR_db_password_secret_name: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          TF_VAR_use_secrets_manager_for_k8s_secrets: true
          TF_VAR_app_k8s_secret_name: ${{ secrets.APP_K8S_SECRET_NAME }}
          TF_VAR_postgres_k8s_secret_name: ${{ secrets.POSTGRES_K8S_SECRET_NAME }}
          TF_VAR_deploy_k8s_postgres: "false"
          TF_VAR_app_image: ${{ needs.build-push-image.outputs.image_uri }}
          TF_VAR_require_existing_iam_roles: "true"
          TF_VAR_cluster_iam_role_name: ${{ secrets.CLUSTER_IAM_ROLE_NAME }}
          TF_VAR_node_iam_role_name: ${{ secrets.NODE_IAM_ROLE_NAME }}
          TF_VAR_cluster_admin_role_name: ${{ secrets.CLUSTER_ADMIN_ROLE_NAME }}
          TF_VAR_environment: prod
          TF_VAR_apply_k8s_manifests: true
        run: terraform apply -auto-approve tfplan-manifests

      - name: Diagnose Kubernetes manifest failure
        if: failure()
        run: |
          set -euo pipefail

          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "kubectl is not configured for a reachable cluster."
            exit 0
          fi

          kubectl get nodes -o wide || true

          if ! kubectl get namespace oficina-api >/dev/null 2>&1; then
            echo "Namespace oficina-api was not created."
            exit 0
          fi

          kubectl -n oficina-api get jobs,pods,svc,events --sort-by=.metadata.creationTimestamp || true
          kubectl -n oficina-api describe job oficina-api-migrate || true

          for pod in $(kubectl -n oficina-api get pods -l job-name=oficina-api-migrate -o name 2>/dev/null); do
            echo "Diagnostics for $pod"
            kubectl -n oficina-api describe "$pod" || true
            kubectl -n oficina-api logs "$pod" --all-containers=true --tail=200 || true
          done
