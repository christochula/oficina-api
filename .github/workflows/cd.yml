name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/christochula/oficina-api

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

  build-push-image:
    runs-on: ubuntu-latest
    needs: build-test

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define image tag
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.meta.outputs.image_tag }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ steps.meta.outputs.image_tag }}
          docker push $IMAGE_NAME:latest

  terraform-apply:
    runs-on: ubuntu-latest
    needs: build-push-image
    if: ${{ secrets.AWS_ROLE_ARN != '' && secrets.AWS_REGION != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_environment: prod
        run: terraform apply -auto-approve

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: [build-push-image, terraform-apply]
    if: ${{ always() && needs.build-push-image.result == 'success' && secrets.KUBE_CONFIG_DATA != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      - name: Update app image
        run: |
          sed -i "s#ghcr.io/christochula/oficina-api:latest#ghcr.io/christochula/oficina-api:${{ needs.build-push-image.outputs.image_tag }}#g" k8s/deployment.yaml

      - name: Apply manifests
        run: kubectl apply -k k8s

      - name: Wait for rollout
        run: kubectl rollout status deployment/oficina-api -n oficina-api --timeout=180s
