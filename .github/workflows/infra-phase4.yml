name: OS Infrastructure
on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-phase4.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: Aplicar o plano revisado na AWS
        type: boolean
        default: false
permissions: { contents: read }
concurrency: { group: os-phase4-infrastructure, cancel-in-progress: false }
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
jobs:
  infrastructure:
    name: OS Terraform apply
    environment: homolog
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize isolated Fase 4 state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          terraform -chdir=infra init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=oficina-fase4/os/terraform.tfstate" -backend-config="region=us-east-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform -chdir=infra validate && terraform -chdir=infra plan -out=tfplan -lock-timeout=5m
        env:
          TF_VAR_vpc_id: ${{ vars.VPC_ID }}
          TF_VAR_subnet_ids: ${{ vars.PRIVATE_SUBNET_IDS_JSON }}
          TF_VAR_node_security_group_id: ${{ vars.EKS_NODE_SECURITY_GROUP_ID }}
      - if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.apply)
        run: terraform -chdir=infra apply -auto-approve -lock-timeout=5m tfplan
