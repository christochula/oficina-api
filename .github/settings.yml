repository:
  name: oficina-api
  default_branch: main
  has_issues: true
  has_projects: false
  has_wiki: false
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts: ["Quality", "E2E", "Container"]
      enforce_admins: true
      restrictions: null
  - name: homolog
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts: ["Quality", "E2E", "Container"]
      enforce_admins: true
      restrictions: null

