# Intencao de configuracao do repositorio. Requer o GitHub "Settings" App para
# aplicar automaticamente; caso contrario, aplicar via docs/operacao/governanca-repos.md.
repository:
  name: oficina-api
  default_branch: main
  has_issues: true
  has_projects: false
  has_wiki: false
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts: ["Quality", "E2E", "Container"]
      enforce_admins: true
      required_linear_history: true
      required_conversation_resolution: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null
