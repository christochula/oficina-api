# Retain static analysis of all application source, including legacy code.
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/*.spec.ts,**/node_modules/**
sonar.sourceEncoding=UTF-8

# Coverage follows Jest collectCoverageFrom for the deployed PHASE4_ENABLED=true
# runtime. Modules/main are composition wiring; app.controller/service are unused.
# Legacy OS/stock modules remain available only with PHASE4_ENABLED=false.
# Do not exclude the reused abrir/gerar DTOs or linha-servico.vo.ts: all three
# remain measured in LCOV. Explicit sibling paths avoid hiding those active files.
sonar.coverage.exclusions=\
  src/**/*.module.ts,\
  src/phase4/module.ts,\
  src/main.ts,\
  src/app.controller.ts,\
  src/app.service.ts,\
  src/estoque/**,\
  src/ordem-servico/application/**,\
  src/ordem-servico/infrastructure/**,\
  src/ordem-servico/domain/*.ts,\
  src/ordem-servico/domain/eventos/**,\
  src/ordem-servico/domain/value-objects/grupo-orcamento.vo.ts,\
  src/ordem-servico/domain/value-objects/orcamento.vo.ts,\
  src/ordem-servico/interfaces/http/v1/*.ts,\
  src/ordem-servico/interfaces/http/v1/dtos/ordem-servico-cliente.dto.ts,\
  src/ordem-servico/interfaces/http/v1/dtos/processar-aprovacao-externa.dto.ts,\
  src/ordem-servico/interfaces/http/v1/dtos/processar-status-email.dto.ts
